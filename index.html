<style>
:root{--bg:#FFF6E5;--card:#fff;--ink:#1B2A25;--mute:#5E6B66;--line:#E4D9C0;--green:#0E7C5A;--gold:#FFB627;--co:#E8500A;--on:#fff;--c1:#F4590C;--c2:#C42B05;--sh:0 1px 2px rgba(27,42,37,.06),0 10px 24px -14px rgba(27,42,37,.35)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0D1815;--card:#16251F;--ink:#F4EFE2;--mute:#9DB0A8;--line:#26392F;--green:#2DD4A0;--gold:#FFC145;--co:#FF7A33;--on:#1a0c04;--c1:#C2410C;--c2:#8E2204;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 24px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.55 "Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));min-height:100vh;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 1.5px) 0 0/22px 22px;opacity:.3}
h1,h2,h3{font-family:"Baloo Da 2","Hind Siliguri",sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--co);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
section{scroll-margin-top:72px}
.wrap{max-width:520px;margin:0 auto;padding:6px 16px 40px}
.bar{position:sticky;top:0;z-index:20;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.barin{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:800 18px "Baloo Da 2",sans-serif;display:flex;gap:8px;align-items:center}
.brand span{display:flex;flex-direction:column;line-height:1.05}
.brand small{font:500 12px "Hind Siliguri",sans-serif;color:var(--mute)}
.brand i{width:38px;height:38px;border-radius:11px;background:#F4590C;display:grid;place-items:center;flex:none}
.ctl{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-width:44px;height:40px;padding:0 12px;font:600 14px "Hind Siliguri",sans-serif;cursor:pointer;display:grid;place-items:center;transition:transform .1s}
.pill:active{transform:scale(.95)}
.nav,.navcta{display:none}
.hero{position:relative;padding:26px 6px 8px}
.hero h1{font-size:clamp(40px,12vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.5px;max-width:9em}
.hero h1 span{display:block}.hero h1 .a{color:var(--co)}
.hero p{color:var(--mute);margin-top:12px;max-width:30em}
.rot{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 12px;font:600 13.5px "Hind Siliguri",sans-serif;box-shadow:var(--sh)}
.rot .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;animation:pulse 2s infinite}
.rt{display:inline-block;min-width:11em;transition:opacity .35s,transform .35s}.rt.out{opacity:0;transform:translateY(-6px)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,124,90,.45)}70%{box-shadow:0 0 0 8px rgba(14,124,90,0)}100%{box-shadow:0 0 0 0 rgba(14,124,90,0)}}
.streak{display:inline-block;max-width:100%;margin-top:12px;background:color-mix(in srgb,var(--co) 13%,transparent);color:var(--co);border-radius:16px;padding:6px 14px;font-size:13.5px;font-weight:600;line-height:1.4}
.streak small{display:block;font-weight:500;font-size:12.5px;opacity:.9}
.camp{margin-top:18px;color:#fff;border-radius:22px;padding:16px;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.2) 0 64px,transparent 65px),radial-gradient(circle at 105% 105%,rgba(255,255,255,.12) 0 140px,transparent 141px),linear-gradient(135deg,var(--c1),var(--c2))}

.camp .ct{font:800 26px/1.05 "Baloo Da 2",sans-serif;margin:6px 0 0}
.camp p{font-size:14px;opacity:.95;max-width:26em}
.cd{display:flex;gap:8px;margin:10px 0 2px}
.cd div{background:rgba(0,0,0,.22);border-radius:12px;min-width:50px;padding:3px 6px;text-align:center}
.cd b{display:block;font:800 20px/1.1 "Baloo Da 2",sans-serif;font-variant-numeric:tabular-nums}
.cd span{font-size:11.5px;opacity:.9}
.cbtn{display:block;margin-top:10px;text-align:center;background:#fff;color:#1B2A25;border-radius:12px;padding:8px;font:800 16px "Baloo Da 2",sans-serif}

.l2{display:block;margin-top:10px;text-align:center;text-decoration:underline;font-size:14.5px;font-weight:600}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);margin-top:14px}
.mini small{font:800 12.5px "Baloo Da 2",sans-serif;color:var(--co);text-transform:uppercase;letter-spacing:.5px}
.mini p{font-size:13.5px;line-height:1.45;margin-top:4px}
h2{font-size:22px;font-weight:800;margin:34px 0 2px;position:relative;padding-bottom:10px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:4px;border-radius:4px;background:var(--co)}
.sub{color:var(--mute);font-size:14px;margin:8px 0 14px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.acc summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;font-weight:600;min-height:48px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--co)}
.acc[open] summary::after{content:"–"}
.acc em{font:800 14px "Baloo Da 2",sans-serif;font-style:normal;background:var(--co);color:var(--on);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none}
.acc p{padding:0 14px 14px 50px;color:var(--mute);font-size:14.5px}
.flags{display:grid;gap:10px}
.flag{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.flag h3{font:800 16px "Baloo Da 2",sans-serif;margin-bottom:6px}
.flag ul{list-style:none;padding:0;display:grid;gap:6px;font-size:14.5px}
.flag li{padding-left:24px;position:relative;line-height:1.4}
.flag li::before{position:absolute;left:0;font-weight:800}
.good h3,.good li::before{color:#14804A}.good li::before{content:"✓"}
.bad h3,.bad li::before{color:#C62828}.bad li::before{content:"✕"}
[data-theme=dark] .good h3,[data-theme=dark] .good li::before{color:#4ADE98}
[data-theme=dark] .bad h3,[data-theme=dark] .bad li::before{color:#FF8A80}
.know{list-style:none;padding:0;display:grid;gap:8px}
.know li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--co);border-radius:12px;padding:10px 14px;font-size:14.5px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.store{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 12px 12px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .2s}
.store:first-child{border-color:var(--co)}
.store:active{transform:scale(.985)}
.mono{width:48px;height:48px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 26px "Baloo Da 2",sans-serif;flex:none}
.mono.lg{background:#fff;border:1px solid var(--line)}.mono img{width:34px;height:34px;object-fit:contain;border-radius:6px}
.store h3{font-size:19px;font-weight:800;line-height:1.1}
.store p{font-size:13px;color:var(--mute);line-height:1.3}
.store em{font:800 14px "Baloo Da 2",sans-serif;font-style:normal;margin-top:auto;align-self:flex-start;background:var(--co);color:var(--on);border-radius:999px;padding:1px 14px}
.cps,.socs{display:grid;gap:12px}
.cp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);display:grid;gap:8px}
.cp h3{font:800 17px "Baloo Da 2",sans-serif}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.cp code{font:700 16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.8px;word-break:break-all}
.cc{border:0;background:var(--co);color:var(--on);border-radius:9px;padding:6px 14px;font:800 14px "Baloo Da 2",sans-serif;cursor:pointer}
.mt{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.mt a{color:var(--co);font:800 14px "Baloo Da 2",sans-serif}
.cp.ex{opacity:.5}.cp.ex .cc{background:var(--mute);pointer-events:none}
.soc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);transition:transform .15s}
.soc:active{transform:scale(.985)}
.si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;background:var(--c)}
.si svg{width:24px;height:24px;fill:currentColor}
.st b{display:block;font:800 17px/1.15 "Baloo Da 2",sans-serif}
.st small{color:var(--mute);font-size:13px}
.soc em{margin-left:auto;font:800 14px "Baloo Da 2",sans-serif;font-style:normal;color:var(--co)}
.rvbox{display:grid;gap:14px}
.rvs{display:grid;gap:12px}
.rsum{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rsum b{font:800 38px "Baloo Da 2",sans-serif;line-height:1}
.stars{color:var(--gold);letter-spacing:2px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.rv .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rv b{font:800 16px "Baloo Da 2",sans-serif}
.rv small,.note{color:var(--mute);font-size:12.5px}
.rv p{font-size:14.5px;margin-top:4px;overflow-wrap:anywhere}
.rf{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);display:grid;gap:10px;align-content:start}
.rf input,.rf textarea{width:100%;font:400 15px "Hind Siliguri",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rf textarea{min-height:96px;resize:vertical}
.rf select{width:100%;font:400 15px "Hind Siliguri",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:600 13.5px "Hind Siliguri",sans-serif;cursor:pointer}
.chip.on{background:var(--co);color:var(--on);border-color:var(--co)}
.store{position:relative}
.sl{display:contents}
.sr{display:block;font-size:12.5px;font-weight:600}.sr .stars{letter-spacing:0}
.best{position:absolute;top:8px;right:10px;background:var(--gold);color:#1B2A25;font:800 11px "Baloo Da 2",sans-serif;border-radius:999px;padding:1px 9px}
.vt{font-size:12.5px;font-weight:600;color:var(--co);margin-top:2px}
.tag{position:absolute;right:2px;top:2px;width:88px;border:0;background:none;cursor:pointer;transform-origin:50% 0;animation:tagidle 6s ease-in-out 1s infinite;color:var(--ink);z-index:2}
.tag.sw{animation:tagsw 1.4s ease-in-out 1}
.tag svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes tagidle{0%,40%,100%{transform:rotate(0)}8%{transform:rotate(14deg)}18%{transform:rotate(-10deg)}28%{transform:rotate(5deg)}}
@keyframes tagsw{0%{transform:rotate(0)}20%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}70%{transform:rotate(5deg)}100%{transform:rotate(0)}}
.rf .hp{position:absolute;left:-9999px}
.pick{display:flex;gap:4px}
.pick button{background:none;border:0;font-size:32px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.pick button.on{color:var(--gold)}
.go{border:0;background:var(--co);color:var(--on);border-radius:12px;height:46px;font:800 16px "Baloo Da 2",sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
.trust{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.trust ul{padding-left:20px;display:grid;gap:8px;color:var(--mute);font-size:14.5px}
.again{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:24px;padding:20px 18px}
.again h2{margin:0 0 4px;color:var(--bg)}.again h2::after{background:var(--gold)}
.again p{opacity:.85;font-size:14.5px;margin-bottom:14px}
.agb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agb .pill{height:50px;font-size:15px;line-height:1.15;background:var(--co);color:var(--on);border:0;min-width:0;padding:0 14px}
footer{margin-top:28px;text-align:center;color:var(--mute);font-size:12.5px;padding-top:6px}
footer p,footer details{margin-top:6px}
footer a{opacity:.85}footer a:hover{text-decoration:underline}
footer summary{cursor:pointer}
footer details p{text-align:left;max-width:640px;margin:6px auto}
.sticky{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:8;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sticky span{font-weight:600;font-size:15px;line-height:1.3}
.sticky a{background:var(--co);color:var(--on);border-radius:11px;padding:8px 16px;font:800 15px "Baloo Da 2",sans-serif;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;z-index:9;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){
body{font-size:17px;padding-bottom:40px}
.bar{padding:12px 32px}.barin{max-width:1176px}
.nav{display:flex;gap:4px;margin-left:auto;margin-right:8px}
.nav a{font:600 15px "Hind Siliguri",sans-serif;padding:8px 14px;border-radius:999px;color:var(--mute)}
.nav a:hover{background:var(--card);color:var(--ink)}
.navcta{display:inline-flex;align-items:center;background:var(--co);color:var(--on);border-radius:999px;padding:8px 20px;font:800 15px "Baloo Da 2",sans-serif;margin-right:14px}
.wrap{max-width:1240px;padding:0 32px 56px}
.top{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:44px 0 12px}
.hero{padding:12px 0}.hero h1{font-size:84px;max-width:none}.hero p{font-size:18px}
.camp{margin:0;padding:24px 26px;border-radius:28px}
.camp .ct{font-size:34px}.cd b{font-size:26px}.cd div{min-width:64px}
h2{font-size:28px;margin-top:64px}
#steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.acc{margin:0}.acc summary{pointer-events:none;padding:18px 18px 6px;min-height:0;font-size:17px}.acc summary::after{display:none}
.acc p{padding:0 18px 18px 54px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:stretch}
.g2>div>h2:first-child{margin-top:56px}
.flags{grid-template-columns:1fr 1fr}
.stores{grid-template-columns:repeat(4,1fr);gap:16px}
.store{padding:18px 16px 16px}
.cps{grid-template-columns:repeat(3,1fr);gap:16px}
.socs{grid-template-columns:repeat(5,1fr);gap:16px}
.soc{flex-direction:column;text-align:center;padding:26px 12px;gap:10px}.soc em{margin:2px 0 0}
.rvbox{grid-template-columns:1.2fr 1fr;gap:32px;align-items:start}
.trust{background:none;border:0;box-shadow:none;padding:0}
.trust ul{list-style:none;padding:0;grid-template-columns:repeat(3,1fr);gap:16px;color:var(--ink)}
.trust li{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--co);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);font-size:15px}
.again{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:28px;padding:28px 32px;border-radius:28px;margin-top:56px}
.again h2{margin:0 0 6px;font-size:26px}.again p{margin:0}
.agb{gap:14px}.agb .pill{height:54px;font-size:16px}
footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.sticky{max-width:640px;bottom:20px}.toast{bottom:32px}
}
</style>

}

var cfg=FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId,db=null,RV=cfg?[]:DEMO.slice(),rate=0,FILT="";
function stars(n){return"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function fillSl(){
  var L=T[lang],best="",bs=0,st={};
  STORES.forEach(function(s){var a=RV.filter(function(r){return r.store===s.n}),t=0;a.forEach(function(r){t+=r.rating});if(a.length){st[s.n]={n:a.length,v:t/a.length};if(a.length>=3&&t/a.length>bs){bs=t/a.length;best=s.n}}});
  document.querySelectorAll(".sl").forEach(function(el){var s=st[el.dataset.s];el.innerHTML=(s?'<small class="sr"><span class="stars">★</span> '+num(s.v.toFixed(1))+' · '+num(s.n)+' '+L.rvCnt+'</small>':'')+(el.dataset.s===best?'<span class="best">'+L.best+'</span>':'')});
}
function chipsR(){
  var L=T[lang],c=[""].concat(STORES.map(function(s){return s.n})),sel=$("#stSel"),v=sel.value;
  $("#chips").innerHTML=c.map(function(n){return'<button type="button" class="chip'+(FILT===n?' on':'')+'" data-f="'+esc(n)+'">'+(n?esc(n):L.all)+'</button>'}).join("");
  sel.innerHTML='<option value="">'+L.gen+'</option>'+STORES.map(function(s){return'<option value="'+esc(s.n)+'">'+esc(s.n)+'</option>'}).join("");sel.value=v;
}
function renderRv(){
  var L=T[lang],list=FILT?RV.filter(function(r){return r.store===FILT}):RV,n=list.length,sum=0;list.forEach(function(r){sum+=r.rating});fillSl();chipsR();
  $("#rsum").innerHTML=n?'<b>'+num((sum/n).toFixed(1))+'</b><span><span class="stars">'+stars(Math.round(sum/n))+'</span><br><small class="note">'+num(n)+' '+L.rvCnt+'</small></span>':'';
  $("#rvs").innerHTML=(n?list.map(function(r){var d="";try{d=new Date(r.t).toLocaleDateString(lang==="bn"?"bn-BD":"en-GB",{day:"numeric",month:"short",year:"numeric"})}catch(e){}
    return'<div class="rv"><div class="h"><b>'+esc(r.name)+'</b><small>'+d+'</small></div>'+'<div class="vt">'+esc(r.store||"Shopping Guide BD")+'</div>'+'<div class="stars">'+stars(r.rating)+'</div><p>'+esc(r.text)+'</p></div>'}).join(""):'<p class="note">'+L.rvEmpty+'</p>')+(cfg?'':'<p class="note">'+L.rvDemo+'</p>');
}
function loadRv(){
  db.collection("reviews").where("approved","==",true).limit(50).get().then(function(s){
    RV=s.docs.map(function(d){var r=d.data();return{name:r.name,rating:Math.min(5,Math.max(1,Math.round(+r.rating||1))),text:r.text,store:String(r.store||"").slice(0,30),t:+r.t||0}}).sort(function(a,b){return b.t-a.t});renderRv()
  }).catch(function(){renderRv()});
}
function sdk(u,cb){var s=document.createElement("script");s.src="https://www.gstatic.com/firebasejs/10.12.2/"+u;s.onload=cb;document.head.appendChild(s)}
if(cfg)sdk("firebase-app-compat.js",function(){sdk("firebase-firestore-compat.js",function(){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();loadRv()})});
function paint(){document.querySelectorAll("#pick button").forEach(function(b){b.classList.toggle("on",+b.dataset.v<=rate)})}
$("#chips").onclick=function(e){var b=e.target.closest("button");if(!b)return;FILT=b.dataset.f;if(FILT)$("#stSel").value=FILT;renderRv()};
$("#pick").onclick=function(e){var b=e.target.closest("button");if(!b)return;rate=+b.dataset.v;paint()};
$("#rf").onsubmit=function(e){
  e.preventDefault();var L=T[lang],f=e.target;
  if(f.hp.value)return;
  var name=f.nm.value.trim().slice(0,40),text=f.tx.value.trim().slice(0,500);
  if(!name||!text||!rate)return toast(L.rvNo);
  if(/https?:|www\.|t\.me|\.com|\.net|\.xyz|bit\.ly/i.test(name+" "+text))return toast(L.rvLink);
  if(Date.now()-(+load("sg-rv")||0)<60000)return toast(L.rvWait);
  var r={name:name,text:text,rating:rate,store:f.st.value,approved:false,t:Date.now()},btn=f.querySelector(".go");
  var done=function(){save("sg-rv",String(Date.now()));f.reset();rate=0;paint();btn.disabled=false;toast(L.rvOk)};
  btn.disabled=true;
  if(db){db.collection("reviews").add(r).then(done,function(){btn.disabled=false;toast(L.rvErr)})}
  else{RV.unshift({name:name,text:text,rating:rate,store:r.store,t:r.t});renderRv();done()}
};
/* ----- Streak, install, theme, language, share ----- */
function visit(){var d=new Date(Date.now()+216e5).toISOString().slice(0,10),n=1;
  try{var o=JSON.parse(load("sg-streak")||"null");if(o){if(o.d===d)n=o.n;else if(new Date(d)-new Date(o.d)===864e5)n=o.n+1}save("sg-streak",JSON.stringify({d:d,n:n}))}catch(x){}
  return n}
var STREAK=visit(),dip=null;
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e});
$("#pwa").onclick=function(){if(dip){dip.prompt();dip=null}else toast(T[lang].homeHow)};
if(matchMedia("(display-mode: standalone)").matches)$("#pwa").hidden=true;
var campVis=true;
function stick(){$("#sticky").hidden=!(live()&&!campVis)}
if(window.IntersectionObserver)new IntersectionObserver(function(e){campVis=e[0].isIntersecting;stick()}).observe($("#camp"));
$("#lang").onclick=function(){lang=lang==="en"?"bn":"en";save("sg-lang",lang);render()};
function setTheme(t){root.dataset.theme=t;$("#theme").textContent=t==="dark"?"☀️":"🌙";$("#theme").setAttribute("aria-pressed",t==="dark");document.querySelector('meta[name=theme-color]').content=t==="dark"?"#0D1815":"#E8500A"}
$("#theme").onclick=function(){var t=root.dataset.theme==="dark"?"light":"dark";setTheme(t);save("sg-theme",t)};
$("#tag").onclick=function(){var t=$("#tag");t.classList.remove("sw");void t.offsetWidth;t.classList.add("sw");toast(T[lang].tagT)};
$("#share").onclick=function(){
  var d={title:"Shopping Guide BD",text:"Shop Smart. Save More.",url:location.href};
  if(navigator.share){navigator.share(d).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){toast(T[lang].copied)})}
};
lang=load("sg-lang")||"en";
setTheme(load("sg-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
render();setInterval(campaign,1000);setInterval(nextRot,2800);
var nb=LEVELS.filter(function(x){return x.d===STREAK&&STREAK>1})[0];
if(nb&&load("sg-badge")!==String(STREAK)){save("sg-badge",String(STREAK));setTimeout(function(){toast("🎉 "+nb.i+" "+nb[lang])},1200)}
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}
</script>
</body>
</html>
